<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<style>
/* --- RESPONSIVE CORE --- */
:root {
  --sidebar-width: 260px;
}

.layout {
  display: flex;
  min-height: calc(100vh - 60px);
}

.sidebar {
  width: var(--sidebar-width);
  /* Use fixed positioning on mobile to "slide in" */
  position: sticky;
  top: 60px;
  height: calc(100vh - 60px);
  transition: transform 0.3s ease;
  z-index: 999;
}

.main {
  flex: 1;
  padding: 20px;
  width: 100%; /* Ensures main content takes full width */
}

/* --- TABLETS (iPad) & PHONES --- */
@media (max-width: 1024px) {
  .sidebar {
    position: fixed;
    left: calc(-1 * var(--sidebar-width)); /* Hide off-screen */
    background: var(--surface);
    box-shadow: 5px 0 15px rgba(0,0,0,0.5);
  }
  
  .sidebar.open {
    transform: translateX(var(--sidebar-width)); /* Slide in */
  }

  .grid-2 {
    grid-template-columns: 1fr; /* Stack cards vertically */
  }

  /* Make tables scrollable on small screens so text stays readable */
  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-bottom: 15px;
  }
}

/* Ensure images/SVGs don't overflow */
svg, img {
  max-width: 100%;
  height: auto;
}
</style>

<script>
// Toggle for Mobile/iPad Menu
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('open');
}

// Auto-close menu when a topic is selected on mobile
function switchModule(modId) {
  // ... (your existing tab logic) ...
  
  if (window.innerWidth <= 1024) {
    document.getElementById('sidebar').classList.remove('open');
  }
}
</script>

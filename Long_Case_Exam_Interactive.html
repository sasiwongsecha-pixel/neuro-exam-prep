<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Case Exam - Internal Medicine</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --accent: #3b82f6;
  --accent2: #60a5fa; --green: #22c55e; --red: #ef4444;
  --orange: #f59e0b; --purple: #a78bfa; --pink: #f472b6;
  --border: #475569; --card: #1e293b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
/* Layout */
.app { display:flex; min-height:100vh; }
.sidebar { width:280px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; transition:transform .3s; z-index:100; }
.main { flex:1; overflow-y:auto; padding:24px; max-width:900px; }
@media(max-width:768px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { padding:16px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99; }
  .overlay.show { display:block; }
}
/* Sidebar */
.sidebar-header { padding:20px; border-bottom:1px solid var(--border); }
.sidebar-header h1 { font-size:18px; color:var(--accent2); }
.sidebar-header p { font-size:12px; color:var(--text2); margin-top:4px; }
.search-box { padding:12px; }
.search-box input { width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; }
.search-box input:focus { border-color:var(--accent); }
.nav-group { margin-bottom:4px; }
.nav-group-title { padding:8px 16px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text2); font-weight:700; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.nav-group-title:hover { color:var(--accent2); }
.nav-group-title .arrow { transition:transform .2s; font-size:10px; }
.nav-group-title .arrow.open { transform:rotate(90deg); }
.nav-items { display:none; }
.nav-items.open { display:block; }
.nav-item { padding:6px 16px 6px 24px; font-size:13px; color:var(--text2); cursor:pointer; border-left:2px solid transparent; transition:all .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav-item:hover { background:var(--surface2); color:var(--text); }
.nav-item.active { border-left-color:var(--accent); color:var(--accent2); background:rgba(59,130,246,.1); }
/* Top bar mobile */
.topbar { display:none; padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; gap:12px; }
@media(max-width:768px) { .topbar { display:flex; } }
.menu-btn { background:none; border:none; color:var(--text); font-size:24px; cursor:pointer; }
/* Content cards */
.topic-card { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:16px; overflow:hidden; }
.card-header { padding:16px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
.card-header:hover { background:var(--surface2); }
.card-header h3 { font-size:15px; display:flex; align-items:center; gap:8px; }
.card-body { padding:0 20px 16px; display:none; }
.card-body.open { display:block; }
.badge { font-size:10px; padding:2px 8px; border-radius:10px; font-weight:600; }
.badge-approach { background:rgba(59,130,246,.2); color:var(--accent2); }
.badge-ddx { background:rgba(167,139,250,.2); color:var(--purple); }
.badge-ix { background:rgba(34,197,94,.2); color:var(--green); }
.badge-tx { background:rgba(244,114,182,.2); color:var(--pink); }
.badge-pe { background:rgba(245,158,11,.2); color:var(--orange); }
/* Differential tree */
.tree { margin:12px 0; }
.tree-node { position:relative; padding-left:20px; margin:4px 0; }
.tree-node::before { content:''; position:absolute; left:6px; top:0; bottom:0; width:1px; background:var(--border); }
.tree-node::after { content:''; position:absolute; left:6px; top:12px; width:12px; height:1px; background:var(--border); }
.tree-node:last-child::before { height:12px; }
.tree-label { display:inline-block; padding:3px 10px; border-radius:6px; font-size:13px; cursor:pointer; transition:all .15s; }
.tree-label:hover { filter:brightness(1.2); }
.tree-label.cat1 { background:rgba(59,130,246,.15); color:var(--accent2); border:1px solid rgba(59,130,246,.3); }
.tree-label.cat2 { background:rgba(167,139,250,.15); color:var(--purple); border:1px solid rgba(167,139,250,.3); }
.tree-label.cat3 { background:rgba(34,197,94,.15); color:var(--green); border:1px solid rgba(34,197,94,.3); }
.tree-label.cat4 { background:rgba(244,114,182,.15); color:var(--pink); border:1px solid rgba(244,114,182,.3); }
.tree-label.cat5 { background:rgba(245,158,11,.15); color:var(--orange); border:1px solid rgba(245,158,11,.3); }
.tree-children { display:none; }
.tree-children.open { display:block; }
/* Content sections */
.section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:16px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; }
.section-title .icon { font-size:14px; }
.content-list { list-style:none; margin:0 0 8px 8px; }
.content-list li { padding:3px 0; font-size:13px; color:var(--text); position:relative; padding-left:14px; line-height:1.5; }
.content-list li::before { content:'•'; position:absolute; left:0; color:var(--accent); }
.highlight { background:rgba(245,158,11,.15); padding:8px 12px; border-radius:8px; border-left:3px solid var(--orange); margin:8px 0; font-size:13px; }
.key-point { background:rgba(34,197,94,.1); padding:8px 12px; border-radius:8px; border-left:3px solid var(--green); margin:8px 0; font-size:13px; }
.warning { background:rgba(239,68,68,.1); padding:8px 12px; border-radius:8px; border-left:3px solid var(--red); margin:8px 0; font-size:13px; }
/* Topic header */
.topic-header { margin-bottom:20px; }
.topic-header h2 { font-size:24px; color:var(--accent2); margin-bottom:4px; }
.topic-header .system-tag { font-size:12px; color:var(--text2); background:var(--surface2); padding:3px 10px; border-radius:12px; display:inline-block; }
/* Expand all */
.controls { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.ctrl-btn { padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text2); font-size:12px; cursor:pointer; transition:all .15s; }
.ctrl-btn:hover { background:var(--surface2); color:var(--text); }
.ctrl-btn.active { background:rgba(59,130,246,.2); border-color:var(--accent); color:var(--accent2); }
/* Welcome */
.welcome { text-align:center; padding:60px 20px; }
.welcome h2 { font-size:28px; color:var(--accent2); margin-bottom:12px; }
.welcome p { color:var(--text2); max-width:500px; margin:0 auto 24px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; max-width:500px; margin:0 auto; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
.stat-card .num { font-size:28px; font-weight:700; color:var(--accent2); }
.stat-card .lbl { font-size:12px; color:var(--text2); margin-top:4px; }
.scroll-top { position:fixed; bottom:20px; right:20px; width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:18px; cursor:pointer; display:none; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.3); }
.scroll-top.show { display:block; }
/* Quiz mode */
.quiz-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; justify-content:center; align-items:center; }
.quiz-overlay.show { display:flex; }
.quiz-card { background:var(--surface); border-radius:16px; padding:32px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
.quiz-card h3 { color:var(--accent2); margin-bottom:16px; }
.quiz-option { padding:10px 16px; margin:6px 0; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:14px; transition:all .15s; }
.quiz-option:hover { background:var(--surface2); }
.quiz-option.correct { background:rgba(34,197,94,.2); border-color:var(--green); }
.quiz-option.wrong { background:rgba(239,68,68,.2); border-color:var(--red); }
.quiz-result { margin-top:12px; padding:12px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

</main>
</div>

let currentTopic = null;

function initApp() {
  const nav = document.getElementById('navContainer');
  const systems = Object.keys(DATA);
  document.getElementById('systemCount').textContent = systems.length;
  let totalTopics = 0;
  systems.forEach(sys => { totalTopics += DATA[sys].length; });
  document.getElementById('topicCount').textContent = totalTopics;
  
  systems.forEach(sys => {
    const group = document.createElement('div');
    group.className = 'nav-group';
    group.innerHTML = `<div class="nav-group-title" onclick="toggleGroup(this)"><span>${sys}</span><span class="arrow">▶</span></div><div class="nav-items"></div>`;
    const items = group.querySelector('.nav-items');
    DATA[sys].forEach((topic, idx) => {
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.textContent = topic.title;
      item.onclick = () => showTopic(sys, idx, item);
      items.appendChild(item);
    });
    nav.appendChild(group);
  });
}

function toggleGroup(el) {
  const arrow = el.querySelector('.arrow');
  const items = el.nextElementSibling;
  arrow.classList.toggle('open');
  items.classList.toggle('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function filterTopics(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.nav-group').forEach(g => {
    let hasMatch = false;
    g.querySelectorAll('.nav-item').forEach(item => {
      const match = item.textContent.toLowerCase().includes(q);
      item.style.display = match ? '' : 'none';
      if (match) hasMatch = true;
    });
    g.style.display = hasMatch ? '' : 'none';
    if (hasMatch && q) {
      g.querySelector('.nav-items').classList.add('open');
      g.querySelector('.arrow').classList.add('open');
    }
  });
}

function showTopic(sys, idx, navItem) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (navItem) navItem.classList.add('active');
  
  const topic = DATA[sys][idx];
  currentTopic = topic;
  document.getElementById('welcome').style.display = 'none';
  const container = document.getElementById('topicContent');
  container.style.display = 'block';
  
  let html = `<div class="topic-header"><h2>${topic.title}</h2><span class="system-tag">${sys}</span></div>`;
  html += `<div class="controls"><button class="ctrl-btn" onclick="expandAll()">Expand All</button><button class="ctrl-btn" onclick="collapseAll()">Collapse All</button></div>`;
  
  // Approach
  if (topic.approach) {
    html += buildCard('🎯 Approach & Priority', 'approach', topic.approach, true);
  }
  // DDx tree
  if (topic.ddx) {
    html += buildDdxCard(topic.ddx);
  }
  // Additional History
  if (topic.additionalHx) {
    html += buildCard('📝 Additional History', 'hx', topic.additionalHx);
  }
  // Additional PE
  if (topic.additionalPE) {
    html += buildCard('🩺 Physical Examination', 'pe', topic.additionalPE);
  }
  // Investigation
  if (topic.investigation) {
    html += buildCard('🔬 Investigation', 'ix', topic.investigation);
  }
  // Diagnosis
  if (topic.diagnosis) {
    html += buildCard('✅ Diagnosis', 'dx', topic.diagnosis);
  }
  // Treatment
  if (topic.treatment) {
    html += buildCard('💊 Treatment & Management', 'tx', topic.treatment);
  }
  // Key points
  if (topic.keyPoints) {
    html += `<div class="key-point"><strong>⭐ Key Points:</strong> ${topic.keyPoints}</div>`;
  }
  
  container.innerHTML = html;
  document.querySelector('.main').scrollTo({top:0});
  
  if (window.innerWidth < 769) toggleSidebar();
}

function buildCard(title, type, content, openByDefault) {
  const badgeClass = type === 'approach' ? 'badge-approach' : type === 'ddx' ? 'badge-ddx' : type === 'ix' ? 'badge-ix' : type === 'tx' ? 'badge-tx' : 'badge-pe';
  const items = Array.isArray(content) ? content : [content];
  let body = '';
  items.forEach(item => {
    if (typeof item === 'string') {
      body += `<div style="font-size:13px;line-height:1.6;margin:4px 0;">${item}</div>`;
    } else if (item.heading) {
      body += `<div class="section-title">${item.heading}</div>`;
      if (item.points) {
        body += '<ul class="content-list">';
        item.points.forEach(p => { body += `<li>${p}</li>`; });
        body += '</ul>';
      }
    }
  });
  return `<div class="topic-card"><div class="card-header" onclick="toggleCard(this)"><h3><span class="badge ${badgeClass}">${type.toUpperCase()}</span> ${title}</h3><span class="arrow">${openByDefault?'▼':'▶'}</span></div><div class="card-body ${openByDefault?'open':''}">${body}</div></div>`;
}

function buildDdxCard(ddx) {
  let tree = '<div class="tree">';
  const cats = ['cat1','cat2','cat3','cat4','cat5'];
  ddx.forEach((branch, i) => {
    tree += buildTreeNode(branch, cats[i % 5]);
  });
  tree += '</div>';
  return `<div class="topic-card"><div class="card-header" onclick="toggleCard(this)"><h3><span class="badge badge-ddx">DDX</span> 🌳 Differential Diagnosis Tree</h3><span class="arrow">▶</span></div><div class="card-body">${tree}</div></div>`;
}

function buildTreeNode(node, cat) {
  let html = '<div class="tree-node">';
  if (node.children && node.children.length) {
    html += `<span class="tree-label ${cat}" onclick="this.parentElement.querySelector('.tree-children').classList.toggle('open')">${node.label} ▸</span>`;
    html += '<div class="tree-children">';
    node.children.forEach(c => { html += buildTreeNode(c, cat); });
    html += '</div>';
  } else {
    html += `<span class="tree-label ${cat}">${node.label}</span>`;
  }
  html += '</div>';
  return html;
}

function toggleCard(el) {
  const body = el.nextElementSibling;
  const arrow = el.querySelector('.arrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
}

function expandAll() {
  document.querySelectorAll('.card-body').forEach(b => b.classList.add('open'));
  document.querySelectorAll('.card-header .arrow').forEach(a => a.textContent = '▼');
  document.querySelectorAll('.tree-children').forEach(t => t.classList.add('open'));
}
function collapseAll() {
  document.querySelectorAll('.card-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.card-header .arrow').forEach(a => a.textContent = '▶');
  document.querySelectorAll('.tree-children').forEach(t => t.classList.remove('open'));
}

// Scroll to top
document.querySelector('.main').addEventListener('scroll', function() {
  document.getElementById('scrollTop').classList.toggle('show', this.scrollTop > 300);
});

initApp();
</script>
</body>
</html>
